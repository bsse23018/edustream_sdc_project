name: Deploy EduStream Web to S3

on:
  push:
    branches:
      - main     # Verify if your branch is 'main' or 'master'
  workflow_dispatch: # Allows you to run this manually from GitHub Actions tab

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout your code
      - name: Checkout Code
        uses: actions/checkout@v3

      # 2. Install Flutter environment
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.38.3' # Or your current version, e.g., '3.x'

      # 3. Clean and Get Dependencies
      - name: Install Dependencies
        run: flutter pub get

      # 4. Build for Web
      # Using HTML renderer avoids some canvaskit CORS issues on S3
      - name: Build Web App
        run: flutter build web

      # 5. Configure AWS Credentials
      # This uses the secrets you will set in the next step
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      # 6. Deploy to S3
      # --delete removes old files so your site stays clean
      - name: Deploy to S3
        run: |
          aws s3 sync build/web s3://${{ secrets.AWS_BUCKET_NAME }} --delete --acl public-read